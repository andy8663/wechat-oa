name: Auto Sync Skill to SkillHub
on:
  push:
    branches: [ main, master ] # 监听你的开发分支
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取GitHub仓库代码
        uses: actions/checkout@v4

      - name: 安装Node & SkillHub CLI
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @tencent/skillhub-cli

      - name: 登录SkillHub并自动更新技能
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
        run: |
          skillhub auth set $SKILLHUB_TOKEN
          # 自动同步当前仓库全部技能，覆盖更新线上版本
          skillhub sync push --auto --yes
